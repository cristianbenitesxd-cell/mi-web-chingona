<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Mi Primera Página</title>
    <style>
        /* Aquí adentro cambiamos cómo se ve la página */
        body {
            background-color: #1e1e1e; /* Cambia el fondo a gris oscuro */
            color: #ffffff;            /* Cambia la letra a color blanco */
            font-family: Arial, sans-serif; /* Cambia el tipo de letra a una más moderna */
            text-align: center;        /* Centra todo el texto en la pantalla */
            padding-top: 100px;        /* Le da espacio arriba para que no esté pegado al techo */
        }
        h1 {
            color: #ffcc00;            /* Hace que el título principal sea de color amarillo dorado */
            font-size: 40px;           /* Agranda el tamaño del título */
        }
        p {
            font-size: 20px;           /* Agranda el tamaño del párrafo */
            color: #cccccc;            /* Ponemos el párrafo en un gris claro elegante */
        }
    </style>
</head>
<body>
    <h1>¡A la mierda los que no creyeron en mí!</h1>
    <p>Este es mi inicio en la programación y nadie me va a parar.</p>
</body>
</html>
