<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Mi Primera Página</title>
    <style>
        body {
            background-color: #121212; 
            color: #ffffff;            
            font-family: 'Segoe UI', Arial, sans-serif; 
            text-align: center;        
            padding-top: 100px;        
        }
        h1 {
            color: #ff3366;           
            font-size: 50px;           
        }
        p {
            font-size: 22px;           
            color: #aaaaaa;            
        }
        .boton-chingon {
            background-color: #ffcc00;
            color: #000000;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0px 4px 15px rgba(255, 204, 0, 0.4);
        }
        .boton-chingon:hover {
            background-color: #ffffff;
            box-shadow: 0px 4px 20px rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
<body>
    <h1>¡A la mierda los que no creyeron!</h1>
    <p>Este es el inicio de mi imperio digital.</p>
    <br><br>
    <button class="boton-chingon" onclick="alert('¡Te dije que no soy ningún inútil, carajo!')">
        Haz clic aquí para callar bocas
    </button>
</body>
</html>
